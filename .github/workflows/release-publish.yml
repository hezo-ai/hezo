name: Release Publish

# Fires when a release PR (head branch release/<version>, opened by release.yml)
# is merged into main. First builds + publishes the agent-base image to GHCR, then
# — only once that push has succeeded — tags the merge commit (no v-prefix) and
# publishes a GitHub Release whose body is the just-merged CHANGELOG.md section.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write # create + push the tag, create the Release

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.11"

jobs:
  # Build the agent-base image and publish it to GHCR tagged with this release's
  # version (+ :latest). Release binaries of this version pull
  # ghcr.io/hezo-ai/agent-base:<version> at provision time instead of building it
  # locally (packages/server/src/services/image-registry.ts) — so the GHCR package
  # must be public for the server's anonymous pull. Multi-arch so amd64 and arm64
  # hosts both pull rather than fall back to a local build; arm64 compiles git from
  # source under QEMU emulation, hence the long timeout.
  #
  # This runs BEFORE the GitHub Release is published (the `publish` job `needs` it):
  # a released version advertises binaries that pull agent-base:<version> at
  # provision time, so cutting the Release before the image is pushed would hand
  # users a version that can't provision if this build fails. cache-from reuses the
  # amd64 layers ci.yml warms on main; arm64 builds cold.
  publish-agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
      packages: write
      # Writing the type=gha build cache (cache-to below) requires the actions
      # scope. This job runs on pull_request (the release PR merging into main),
      # where the cache-service runtime token is NOT granted cache-write scope by
      # default — unlike ci.yml's build-agent-image, which runs on push and works
      # without it. Without this the cache export fails ("failed to reserve cache:
      # token has no writable scopes"), and because buildkit exports the image and
      # the cache concurrently and treats a cache-export error as fatal, that
      # cancels the in-flight GHCR push and fails the whole release (see the failed
      # run 28863819276 on release/0.16.0).
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # post-merge main, matching the published binaries
      - id: meta
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: echo "version=${HEAD_REF#release/}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.agent-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hezo-ai/agent-base:${{ steps.meta.outputs.version }}
            ghcr.io/hezo-ai/agent-base:latest
          cache-from: type=gha
          # ignore-error keeps an optional cache-export problem from cancelling the
          # GHCR push this release gates on — the downstream publish job needs this
          # image live before it tags and cuts the Release.
          cache-to: type=gha,mode=max,ignore-error=true

  # Cross-compile the release binaries, tag the merge commit, and publish the
  # GitHub Release. `needs: publish-agent-image` is the gate the whole change is
  # about: nothing here (tag, Release, or advertised assets) lands until the
  # agent-base image for this version is live in GHCR, so a published version can
  # never point users at binaries whose provisioning pull would 404.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: publish-agent-image
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # post-merge main, which includes the bump + changelog
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # Bun cross-compiles every platform from this one Linux runner. Each
      # binary embeds the frontend, migrations, agent roles, and version, so
      # the artifacts are fully self-contained. macOS binaries are unsigned —
      # see CHANGELOG/docs for the Gatekeeper quarantine note.
      - name: Build release binaries
        run: bun run build:release

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${HEAD_REF#release/}"
          echo "Publishing release ${version}"

          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "::error::Tag ${version} already exists. Aborting."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release ${version}"
          git push origin "refs/tags/${version}"

          bun run release --notes "$version" > /tmp/release-notes.md
          gh release create "$version" --title "$version" --notes-file /tmp/release-notes.md \
            dist/binaries/*

  # Keep the AWS CloudFormation template the README's "Deploy on AWS" (Launch
  # Stack) button points at in sync with the repo. The button serves whatever is
  # hosted in S3, so a stale object ships a stale template; this re-uploads
  # deploy/aws/hezo.cfn.yaml on every release. Runs after `publish` so S3 is only
  # touched on a clean release, and skips cleanly when AWS credentials are not
  # configured (e.g. forks). Bucket/region default to the org's setup and can be
  # overridden with repo variables. Requires two repo secrets — AWS_ACCESS_KEY_ID
  # and AWS_SECRET_ACCESS_KEY for an IAM identity scoped to s3:PutObject on the
  # bucket.
  publish-cfn-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # post-merge main, matching the published release
      - name: Upload deploy/aws/hezo.cfn.yaml to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.HEZO_CFN_S3_REGION || 'us-east-1' }}
          BUCKET: ${{ vars.HEZO_CFN_S3_BUCKET || 'hezo-deploy' }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "AWS credentials not configured (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY); skipping S3 upload of hezo.cfn.yaml."
            exit 0
          fi
          # EC2 rejects non-ASCII in SecurityGroup GroupDescription, so refuse to
          # ship a template that would fail the Launch Stack button (regression
          # guard for the em-dash bug fixed in #731).
          if LC_ALL=C grep -nP '[^\x00-\x7F]' deploy/aws/hezo.cfn.yaml; then
            echo "::error file=deploy/aws/hezo.cfn.yaml::Template contains non-ASCII characters; CloudFormation/EC2 will reject it. Not uploading."
            exit 1
          fi
          aws s3 cp deploy/aws/hezo.cfn.yaml "s3://${BUCKET}/hezo.cfn.yaml" --content-type text/yaml
          echo "Uploaded deploy/aws/hezo.cfn.yaml to s3://${BUCKET}/hezo.cfn.yaml"

  # Tell the marketing website (hezo-ai/website) a release was published so it
  # pins its vendor/hezo submodule to the new tag and Cloudflare Pages redeploys
  # the docs. The website tracks RELEASES, not main — hezo.ai/docs must describe
  # the version users can actually download, so the sync fires only here. (A
  # `release: published` trigger on a separate workflow would never fire: the
  # Release above is created with this workflow's own GITHUB_TOKEN, and GitHub
  # suppresses events from that token to prevent workflow recursion.) The bump
  # logic and a manual re-pin fallback live in the website repo's
  # update-hezo-submodule.yml; this job only announces the tag.
  notify-website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
    steps:
      # Mint a short-lived token for the website repo via the existing
      # hezo-release-bot app (App ID 3938851). Requires repo secrets
      # RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY, and the app installed on
      # hezo-ai/website with Contents:write.
      - name: Mint app token (website)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: hezo-ai
          repositories: website

      - name: Dispatch release-published event to website
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${HEAD_REF#release/}"
          gh api repos/hezo-ai/website/dispatches \
            -f event_type=hezo-release-published \
            -F "client_payload[tag]=${version}"
          echo "Dispatched hezo-release-published (tag ${version}) to hezo-ai/website"
