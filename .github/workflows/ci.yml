name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BUN_VERSION: "1.3.11"
  PLAYWRIGHT_VERSION: "1.59.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Build the agent base image once and publish it to GHCR so the test-backend
  # runner (a separate VM) can pull it. Without this image present, the three
  # *-docker.test.ts container suites in the server package self-skip.
  build-agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      # Whether the image made it to GHCR, i.e. whether test-backend can pull
      # it. Read by test-backend below — never infer it from the event name
      # there, or the two jobs drift.
      published: ${{ steps.publishable.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      # A pull_request from a fork runs with a read-only GITHUB_TOKEN: the
      # `packages: write` requested above is not grantable, so the push is
      # denied outright ("denied: installation not allowed to Write organization
      # package"). That used to fail this job, which skipped test-backend (it
      # `needs:` this one), which failed test-backend-complete — leaving every
      # fork PR unmergeable over an image it never needed. So on a fork PR we
      # still build (keeping the Dockerfile under test) but don't push, and
      # test-backend runs without the image while the container suites self-skip.
      - name: Decide whether GHCR is writable
        id: publishable
        run: |
          echo "value=${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.publishable.outputs.value == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The agent-base image installs everything (incl. git) from Debian
      # packages, so a cold build is quick; the gha layer cache keeps
      # unchanged-Dockerfile runs cheaper still.
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.agent-base
          push: ${{ steps.publishable.outputs.value }}
          tags: ghcr.io/hezo-ai/agent-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gated on the image build so the *-docker.test.ts suites actually run
    # instead of self-skipping.
    needs: build-agent-image
    permissions:
      contents: read
      packages: read
    # Sharded across runners: each shard runs ~a fifth of the server files at the
    # same per-runner fork concurrency, so the per-fork PGlite+Hono contention
    # ceiling (the reason we can't just raise --concurrency) is unchanged.
    # 5 shards keeps every shard comfortably under 5 minutes wall time.
    # fail-fast off so one shard failing still lets the others report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: docker/login-action@v3
        if: needs.build-agent-image.outputs.published == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull the image built by build-agent-image and retag to the exact name the
      # container suites gate on (`docker image inspect hezo/agent-base:latest`).
      # Every shard pulls it — vitest file-sharding is non-deterministic about
      # which shard gets the *-docker.test.ts suites. Image is cached in GHCR.
      - name: Pull agent base image
        if: needs.build-agent-image.outputs.published == 'true'
        run: |
          docker pull ghcr.io/hezo-ai/agent-base:${{ github.sha }}
          docker tag ghcr.io/hezo-ai/agent-base:${{ github.sha }} hezo/agent-base:latest
      # No silent coverage gap: say so in the run when the container suites are
      # going to self-skip because the image couldn't be published.
      - name: Note unavailable agent base image
        if: needs.build-agent-image.outputs.published != 'true'
        run: |
          echo "::notice title=agent-base image unavailable::A fork pull request gets a read-only GITHUB_TOKEN, so the image was built but not pushed to GHCR. The *-docker.test.ts container suites will self-skip on this run; they run in full once the change lands on main."
      - run: bun install --frozen-lockfile
      # Runs the server vitest suite (Node runtime) — including the ssh-agent /
      # egress-proxy / mcp-connections container suites now that the image is
      # present — followed by the Bun-native tier (test/bun/** under `bun test`,
      # gated to shard 1 by scripts/test.ts), which exercises runtime-sensitive
      # code (e.g. egress TLS) on the production Bun runtime. --coverage writes
      # lcov to packages/server/coverage (vitest) and coverage-bun (Bun tier).
      - run: bun run test --package server --shard ${{ matrix.shard }}/5 --coverage
      # Upload this shard's istanbul coverage-final.json as an artifact for the
      # coverage-merge job (which combines shards in JSON space, not by OR-ing
      # per-shard lcovs — that double-counts branches whose coverage-v8 ordinals
      # differ per run). if:always() + reportOnFailure:true so a failing shard
      # still contributes its partial report.
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: packages/server/coverage/coverage-final.json
          if-no-files-found: ignore
      # The Bun-native tier only runs on shard 1 (gated in scripts/test.ts) and
      # writes only lcov (no branch data); the merge job reconciles it against the
      # merged vitest line model.
      - name: Upload backend Bun-native coverage
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: backend-bun-coverage
          path: packages/server/coverage-bun/lcov.info
          if-no-files-found: ignore

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sharded across runners; each shard stays at --concurrency 4. The 4-core
    # contention budget below is per-runner, so adding runners is safe. 5 shards
    # keeps every shard comfortably under 5 minutes wall time.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # ubuntu-latest is 4 cores; 10 forks each owning a PGlite + Hono boot
      # produces enough contention that random `findBy*` queries time out.
      - run: bun run test --package web --concurrency 4 --shard ${{ matrix.shard }}/5 --coverage
      # This shard's coverage-final.json feeds the coverage-merge job.
      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-${{ matrix.shard }}
          path: packages/web/coverage/coverage-final.json
          if-no-files-found: ignore

  # The pure-logic shared package (packages/shared) has no DB/DOM/browser
  # dependencies, so it runs as a single fast job (no sharding). Its coverage
  # joins the same Coveralls parallel build under the `shared` flag.
  test-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test --package shared --coverage
      - name: Upload shared coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-coverage
          path: packages/shared/coverage/coverage-final.json
          if-no-files-found: ignore

  # External-Postgres driver conformance: the database-* suites run their
  # env-gated postgres legs against a real postgres:16 service, proving the
  # PostgresDb driver returns byte-identical shapes to PGlite (the contract the
  # always-on PGlite legs pin). The Bun-native pg-driver test also runs here —
  # node-postgres rides node:net/node:tls, which diverge between Node (vitest)
  # and the production Bun runtime. Single (non-matrix) job: no *-complete
  # rollup needed; required directly by the main ruleset under its bare name.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hezo
          POSTGRES_PASSWORD: hezo
          POSTGRES_DB: hezo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hezo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEZO_TEST_DATABASE_URL: postgres://hezo:hezo@localhost:5432/hezo
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test --package server --pattern database-
      - name: Bun-native pg driver test
        run: cd packages/server && bun test ./test/bun/database-pg-driver.bun.test.ts

  # External S3 driver conformance: the asset-storage suites run their env-gated
  # external leg against a real MinIO, proving the S3AssetStore driver behaves
  # identically to the always-on in-process-sim legs. The Bun-native S3 client
  # test also runs here — the client rides the runtime's own fetch/crypto.subtle,
  # which a Node-only vitest run can't vouch for. Single (non-matrix) job: no
  # *-complete rollup needed. Not (yet) in the main ruleset's required checks.
  test-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEZO_TEST_ASSET_STORAGE_URL: "s3://hezo:hezo-secret-key@localhost:9000/hezo-test?tls=false&pathStyle=true"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # A plain docker run, not a service container: services can't override
      # the image command and minio/minio requires `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=hezo -e MINIO_ROOT_PASSWORD=hezo-secret-key \
            minio/minio:latest server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
      - name: Create test bucket
        env:
          AWS_ACCESS_KEY_ID: hezo
          AWS_SECRET_ACCESS_KEY: hezo-secret-key
        run: aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 mb s3://hezo-test
      - run: bun run test --package server --pattern asset-storage
      - name: Bun-native S3 client test
        run: cd packages/server && bun test ./test/bun/asset-s3-client.bun.test.ts

  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Sharded across runners the same way the vitest tiers are: Playwright splits
    # its suite into thirds (`--shard <i>/3`), so wall time drops to roughly a
    # third versus the single-runner run. fail-fast off so one shard failing
    # still lets the others report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # Both Playwright install paths below run `apt-get update`, which fails
      # hard (exit 100) if any pre-configured apt source 403s. The runner image
      # ships Microsoft's azure-cli/prod repos, which Playwright doesn't need and
      # which intermittently return 403 — taking the whole browser shard down.
      # Drop those sources first so an unrelated repo outage can't fail the job.
      - name: Remove unneeded Microsoft apt sources (avoid 403 flakes)
        run: |
          sudo grep -rlZ 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -0 -r rm -f || true
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run test --browser --shard ${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Stable aggregate check names for branch protection. The sharded jobs above
  # fan out to `test-backend (1)`, `test-integration (2)`, … which a required
  # status check can't pin to; these roll each matrix up to a single name that
  # is green only when every shard passed. Point branch protection at these.
  test-backend-complete:
    if: always()
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test-backend.result }}" = "success" ]'

  test-integration-complete:
    if: always()
    needs: test-integration
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test-integration.result }}" = "success" ]'

  test-shared-complete:
    if: always()
    needs: test-shared
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test-shared.result }}" = "success" ]'

  test-browser-complete:
    if: always()
    needs: test-browser
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test-browser.result }}" = "success" ]'

  # Combines every shard/tier's coverage into ONE report and uploads it to
  # Coveralls as a single (non-parallel) build. Merging the shards' istanbul
  # coverage-final.json in JSON space (scripts/coverage/merge.ts) numbers each
  # branch once from the merged map, so — unlike OR-ing per-shard lcovs, which is
  # what a Coveralls parallel build does — the same source branch isn't counted
  # under different coverage-v8 ordinals across shards. That double-counting had
  # inflated the branch denominator (~19.5k real → ~36k reported) and pushed the
  # combined line+branch total ~6 points below its true value. Runs regardless of
  # test outcome (if:always) so a failed shard still finalizes partial coverage.
  # Not a required check — coverage reports on the PR but never blocks a merge.
  # Requires the repo to be enabled on Coveralls (see AGENTS.md).
  coverage-merge:
    if: always()
    needs: [test-backend, test-integration, test-shared]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Every per-shard artifact lands under its own subdir of coverage-artifacts/
      # (backend-coverage-<n>/, web-coverage-<n>/, shared-coverage/,
      # backend-bun-coverage/), which resolveArtifacts() in
      # scripts/coverage/merge.ts globs. The `*coverage*` pattern skips unrelated
      # artifacts (e.g. playwright-report-*).
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
          pattern: "*coverage*"
      - name: Merge coverage into one lcov
        run: bun run scripts/coverage/merge.ts --artifacts coverage-artifacts --out coverage/lcov.info
      - name: Upload combined coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          fail-on-error: false
          allow-empty: true
