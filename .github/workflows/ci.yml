name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BUN_VERSION: "1.3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Build the agent base image once and publish it to GHCR so the test-backend
  # runner (a separate VM) can pull it. Without this image present, the three
  # *-docker.test.ts container suites in the server package self-skip.
  build-agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      # Whether the image made it to GHCR, i.e. whether test-backend can pull
      # it. Read by test-backend below — never infer it from the event name
      # there, or the two jobs drift.
      published: ${{ steps.published.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      # A pull_request from a fork runs with a read-only GITHUB_TOKEN: the
      # `packages: write` requested above is not grantable, so the push is
      # denied outright ("denied: installation not allowed to Write organization
      # package"). That used to fail this job, which skipped test-backend (it
      # `needs:` this one), which failed test-backend-complete — leaving every
      # fork PR unmergeable over an image it never needed. So on a fork PR we
      # still build (keeping the Dockerfile under test) but don't push, and
      # test-backend runs without the image while the container suites self-skip.
      - name: Decide whether GHCR is writable
        id: publishable
        run: |
          echo "value=${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.publishable.outputs.value == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The agent-base image installs everything (incl. git) from Debian
      # packages, so a cold build is quick; the gha layer cache keeps
      # unchanged-Dockerfile runs cheaper still.
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.agent-base
          push: ${{ steps.publishable.outputs.value }}
          tags: ghcr.io/hezo-ai/agent-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Emitted *after* the push, not beside the decision to attempt one. The
      # `publishable` step runs first and succeeds either way, so publishing its
      # value as the output meant a build that failed at the push still claimed
      # the image was there — and every backend shard then failed on a `docker
      # pull` of a tag that does not exist. A later step does not run once an
      # earlier one fails, so this is empty exactly when the image is missing.
      - name: Record that the image reached GHCR
        id: published
        if: steps.publishable.outputs.value == 'true'
        run: echo "value=true" >> "$GITHUB_OUTPUT"

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deliberately needs nothing: every suite here runs on plain Node with no
    # Docker daemon and no agent-base image. The container-dependent work - the
    # three *-docker.test.ts vitest suites and the whole Bun-native tier - moved
    # to test-containers below, so these shards no longer wait on the image
    # build, log in to GHCR, or pull anything.
    # Sharded across runners: each shard runs ~a fifth of the server files at the
    # same per-runner fork concurrency, so the per-fork PGlite+Hono contention
    # ceiling (the reason we can't just raise --concurrency) is unchanged.
    # fail-fast off so one shard failing still lets the others report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Runs the server vitest suite (Node runtime). The three container suites
      # land in whichever shard vitest's file-sharding gives them and self-skip
      # for want of the image, which is exactly why they are also run for real in
      # test-containers. --skip-bun-native keeps the un-shardable Bun tier out of
      # every shard rather than welding it to shard 1: it was 121s of the 357s
      # that made shard 1 the slowest job in the workflow.
      - run: bun run test --package server --shard ${{ matrix.shard }}/5 --skip-bun-native --coverage
      # Upload this shard's istanbul coverage-final.json as an artifact for the
      # coverage-merge job (which combines shards in JSON space, not by OR-ing
      # per-shard lcovs — that double-counts branches whose coverage-v8 ordinals
      # differ per run). if:always() + reportOnFailure:true so a failing shard
      # still contributes its partial report.
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: packages/server/coverage/coverage-final.json
          if-no-files-found: ignore

  # Everything in the backend tier that needs a Docker daemon and the agent-base
  # image, on one runner: the three vitest suites that provision real containers,
  # plus the whole Bun-native tier (test/bun/** under `bun test`), which
  # exercises runtime-sensitive code - egress TLS, docker exec/log framing - on
  # the production Bun runtime and half of whose files drive containers too.
  #
  # It sits outside the shard matrix for two reasons. The Bun tier is not
  # shardable by vitest, so it used to be pinned to shard 1 and made that shard
  # the slowest job in the workflow; and pinning the container suites here means
  # the five shards no longer each pull the image (~40s apiece) just because
  # file-sharding might hand them one of these three.
  #
  # Rolls up into test-backend-complete, so the branch ruleset's existing
  # required check covers it with no ruleset edit.
  test-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ordered after the image build so these suites run against a real image
    # instead of self-skipping - but **not gated on its success**. A bare
    # `needs:` skips this job when that one fails, which turns a registry hiccup
    # into a required check that failed having tested nothing. Every step below
    # that touches the image is conditioned on `published`, and all of these
    # suites self-skip without it, so running image-less is a path that already
    # works - it is the one a fork PR takes on every run.
    needs: build-agent-image
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: docker/login-action@v3
        if: needs.build-agent-image.outputs.published == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Retag to the exact name the container suites gate on
      # (`docker image inspect hezo/agent-base:latest`). Cached in GHCR.
      - name: Pull agent base image
        if: needs.build-agent-image.outputs.published == 'true'
        run: |
          docker pull ghcr.io/hezo-ai/agent-base:${{ github.sha }}
          docker tag ghcr.io/hezo-ai/agent-base:${{ github.sha }} hezo/agent-base:latest
      # No silent coverage gap: say so in the run when these suites are going to
      # self-skip, and say which of the two reasons it was - a fork PR never had
      # a writable token, while a failed build means the image itself needs
      # looking at.
      - name: Note unavailable agent base image
        if: needs.build-agent-image.outputs.published != 'true' && needs.build-agent-image.result == 'success'
        run: |
          echo "::notice title=agent-base image unavailable::A fork pull request gets a read-only GITHUB_TOKEN, so the image was built but not pushed to GHCR. The container suites in this job will self-skip on this run; they run in full once the change lands on main."
      - name: Warn that the agent base image failed to build
        if: needs.build-agent-image.result != 'success'
        run: |
          echo "::warning title=agent-base image unavailable::build-agent-image did not succeed, so the container suites in this job self-skip on this run. The rest of the backend tier still ran in test-backend. Check that job before trusting a green result here."
      - run: bun install --frozen-lockfile
      # The three vitest suites naming hezo/agent-base and provisioning real
      # containers from it, plus the Bun tier (--bun-native forces it on, since
      # the --pattern list would otherwise select it out). Keep this list in step
      # with the suites that call imageExists(BRIDGE_IMAGE) - a new one added to
      # the shards instead just self-skips there, silently.
      - run: >
          bun run test --package server --bun-native --coverage
          --pattern egress-proxy-docker
          --pattern ssh-agent-docker
          --pattern mcp-connections-docker
      # Named backend-coverage-containers, not -<n>: resolveArtifacts() in
      # scripts/coverage/merge.ts globs any backend-coverage-* subdir, and a
      # numeric name here would collide with a real shard's.
      - name: Upload container-suite coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-containers
          path: packages/server/coverage/coverage-final.json
          if-no-files-found: ignore
      # The Bun tier writes only lcov (no branch data); the merge job reconciles
      # it against the merged vitest line model.
      - name: Upload backend Bun-native coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-bun-coverage
          path: packages/server/coverage-bun/lcov.info
          if-no-files-found: ignore

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sharded across runners; each shard stays at --concurrency 4. The 4-core
    # contention budget below is per-runner, so adding runners is safe. 5 shards
    # keeps every shard comfortably under 5 minutes wall time.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # ubuntu-latest is 4 cores; 10 forks each owning a PGlite + Hono boot
      # produces enough contention that random `findBy*` queries time out.
      - run: bun run test --package web --concurrency 4 --shard ${{ matrix.shard }}/5 --coverage
      # This shard's coverage-final.json feeds the coverage-merge job.
      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-${{ matrix.shard }}
          path: packages/web/coverage/coverage-final.json
          if-no-files-found: ignore

  # The pure-logic shared package (packages/shared) has no DB/DOM/browser
  # dependencies, so it runs as a single fast job (no sharding). Its
  # coverage-final.json is uploaded as an artifact like every other tier's and
  # folded into the single Coveralls upload by the coverage-merge job below.
  test-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test --package shared --coverage
      - name: Upload shared coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-coverage
          path: packages/shared/coverage/coverage-final.json
          if-no-files-found: ignore

  # External-Postgres driver conformance: the database-* suites run their
  # env-gated postgres legs against a real postgres:16 service, proving the
  # PostgresDb driver returns byte-identical shapes to PGlite (the contract the
  # always-on PGlite legs pin). The Bun-native pg-driver test also runs here —
  # node-postgres rides node:net/node:tls, which diverge between Node (vitest)
  # and the production Bun runtime. Single (non-matrix) job: no *-complete
  # rollup needed; required directly by the main ruleset under its bare name.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hezo
          POSTGRES_PASSWORD: hezo
          POSTGRES_DB: hezo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hezo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEZO_TEST_DATABASE_URL: postgres://hezo:hezo@localhost:5432/hezo
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test --package server --pattern database-
      - name: Bun-native pg driver test
        run: cd packages/server && bun test ./test/bun/database-pg-driver.bun.test.ts

  # External S3 driver conformance: the asset-storage suites run their env-gated
  # external leg against a real MinIO, proving the S3AssetStore driver behaves
  # identically to the always-on in-process-sim legs. The Bun-native S3 client
  # test also runs here — the client rides the runtime's own fetch/crypto.subtle,
  # which a Node-only vitest run can't vouch for. Single (non-matrix) job: no
  # *-complete rollup needed. Not (yet) in the main ruleset's required checks.
  test-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEZO_TEST_ASSET_STORAGE_URL: "s3://hezo:hezo-secret-key@localhost:9000/hezo-test?tls=false&pathStyle=true"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # A plain docker run, not a service container: services can't override
      # the image command and minio/minio requires `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=hezo -e MINIO_ROOT_PASSWORD=hezo-secret-key \
            minio/minio:latest server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
      - name: Create test bucket
        env:
          AWS_ACCESS_KEY_ID: hezo
          AWS_SECRET_ACCESS_KEY: hezo-secret-key
        run: aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 mb s3://hezo-test
      - run: bun run test --package server --pattern asset-storage
      - name: Bun-native S3 client test
        run: cd packages/server && bun test ./test/bun/asset-s3-client.bun.test.ts

  # test-browser runs inside Playwright's own container image, and that tag must
  # match the Playwright the lockfile resolves to: browsers live in a
  # per-revision directory, so a mismatched image means "Executable doesn't
  # exist". `container.image` cannot read the `env` context - only github,
  # needs, strategy, matrix, vars and inputs - so the tag can't come from an
  # env var. Derive it from bun.lock, the actual source of truth, and hand it
  # over via `needs`. That leaves nothing hand-synced: bumping Playwright in
  # the lockfile moves the image with it, with no second place to remember.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        run: |
          version="$(grep -o '"@playwright/test@[0-9][^"]*"' bun.lock | head -1 | sed 's/.*@//; s/"$//')"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Could not read @playwright/test's version out of bun.lock (got '$version'). test-browser picks its container image from this."
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bun.lock resolves @playwright/test to $version"

  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Runs inside Playwright's own image, which ships the browsers AND their
    # system libraries pre-installed. That is the whole point: the previous
    # setup installed them per run with `playwright install-deps`, which shells
    # out to `apt-get update`, and the runner's azure mirror routinely goes Ign
    # and leaves the archive.ubuntu.com fallback dangling with no output. apt
    # has no default fetch timeout, so that hung for the full job cap - four
    # separate runs, sometimes all three shards at once. It is a known, still
    # open runner-image bug (actions/runner-images#11347), so the fix is to
    # take apt out of this job entirely rather than keep tuning it. Doing that
    # also drops the browser download and its 253 MB cache: nothing here now
    # touches apt, cdn.playwright.dev or the cache service.
    #
    # Running as root is fine - Playwright always passes --no-sandbox and
    # --disable-dev-shm-usage. --ipc=host is its documented flag for stopping
    # Chromium running out of memory in a container.
    needs: playwright-version
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    # A `run:` step defaults to bash on a runner but to `sh` in this container,
    # which silently turned the failure-context step below into `sh -e` and made
    # it die on `shopt: not found` - exit 127 on top of the browser failure it
    # existed to explain. Pin the job back to the host default so every step
    # here, present and future, gets the shell it was written against.
    defaults:
      run:
        shell: bash
    # Sharded across runners the same way the vitest tiers are: Playwright splits
    # its suite into thirds (`--shard <i>/3`), so wall time drops to roughly a
    # third versus the single-runner run. fail-fast off so one shard failing
    # still lets the others report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      # Not oven-sh/setup-bun: it unpacks a zip via `unzip`, which this image
      # does not carry. npm is present (the image installs yarn with it), and
      # `npm install -g bun` is already how docker/Dockerfile.agent-base gets
      # bun, so this reuses a path the repo already relies on.
      - name: Install bun
        timeout-minutes: 5
        run: npm install -g bun@${{ env.BUN_VERSION }}
      # Deliberately no bun cache here, unlike every other job. This image has
      # no zstd, and the compression method is part of the cache *version*
      # hash, so a gzip-compressing container can never match the zstd entries
      # the host jobs write - it just maintains a second 136 MB copy of the
      # same content under the same key. It does not even pay for itself:
      # measured on run 32239850690, the save cost 18-22s per shard while a
      # cold `bun install` here takes 3-4s. Restore this step only alongside a
      # measurement showing install got slow enough to be worth caching.
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: bun run test --browser --shard ${{ matrix.shard }}/3
      # Everything needed to diagnose a failure is in the artifact below, but
      # reading it means downloading a zip — a slow loop for a browser failure
      # that only reproduces on CI. So print the page-side evidence into the job
      # log too. `test/browser/diagnostics.ts` already logs the shell's geometry
      # from the fixture; this adds Playwright's own snapshot of the accessibility
      # tree at the moment of failure, which covers specs that drive their own
      # `test` (master-key-gate) and so never reach that fixture.
      - name: Print Playwright failure context
        if: failure()
        run: |
          shopt -s globstar nullglob
          # error-context.md ONLY. The page-state dump is already in this log via
          # the fixture's stdout, and it lands on disk twice (the file the fixture
          # writes plus Playwright's copy under attachments/) — globbing it here
          # printed every dump three times per attempt, which buries the failure
          # the log exists to surface.
          found=0
          for f in test-results/**/error-context.md; do
            found=1
            echo "::group::$f"
            head -c 60000 "$f"
            echo
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no error-context.md written (the failure was not page-side)"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Stable aggregate check names for branch protection. The sharded jobs above
  # fan out to `test-backend (1)`, `test-integration (2)`, … which a required
  # status check can't pin to; these roll each matrix up to a single name that
  # is green only when every shard passed. Point branch protection at these.
  # Covers test-containers as well as the shard matrix: the container suites and
  # the Bun-native tier are part of the backend tier, just on their own runner,
  # so folding them in here keeps `test-backend-complete` the one required check
  # for the whole tier and needs no ruleset edit.
  test-backend-complete:
    if: always()
    needs: [test-backend, test-containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.test-backend.result }}" = "success" ]'
      - run: '[ "${{ needs.test-containers.result }}" = "success" ]'

  test-integration-complete:
    if: always()
    needs: test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.test-integration.result }}" = "success" ]'

  test-shared-complete:
    if: always()
    needs: test-shared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.test-shared.result }}" = "success" ]'

  test-browser-complete:
    if: always()
    needs: test-browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.test-browser.result }}" = "success" ]'

  # Combines every shard/tier's coverage into ONE report and uploads it to
  # Coveralls as a single (non-parallel) build. Merging the shards' istanbul
  # coverage-final.json in JSON space (scripts/coverage/merge.ts) numbers each
  # branch once from the merged map, so — unlike OR-ing per-shard lcovs, which is
  # what a Coveralls parallel build does — the same source branch isn't counted
  # under different coverage-v8 ordinals across shards. That double-counting had
  # inflated the branch denominator (~19.5k real → ~36k reported) and pushed the
  # combined line+branch total ~6 points below its true value. Runs regardless of
  # test outcome (if:always) so a failed shard still finalizes partial coverage.
  # Not a required check — coverage reports on the PR but never blocks a merge.
  # Requires the repo to be enabled on Coveralls (see AGENTS.md).
  coverage-merge:
    if: always()
    needs: [test-backend, test-containers, test-integration, test-shared]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Every per-shard artifact lands under its own subdir of coverage-artifacts/
      # (backend-coverage-<n>/, backend-coverage-containers/, web-coverage-<n>/,
      # shared-coverage/, backend-bun-coverage/), which resolveArtifacts() in
      # scripts/coverage/merge.ts globs. The `*coverage*` pattern skips unrelated
      # artifacts (e.g. playwright-report-*).
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
          pattern: "*coverage*"
      - name: Merge coverage into one lcov
        run: bun run scripts/coverage/merge.ts --artifacts coverage-artifacts --out coverage/lcov.info
      - name: Upload combined coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          fail-on-error: false
          allow-empty: true
