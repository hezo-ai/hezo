#cloud-config
# ---------------------------------------------------------------------------
# Hezo — portable one-click deploy (cloud-init user-data)
#
# Paste this whole file into your VPS provider's "User data" / "Cloud config" /
# "Startup script" field when creating an Ubuntu server (2 GB RAM+ recommended).
# Works as-is on DigitalOcean, Hetzner, Vultr, Linode, and AWS Lightsail.
#
# On first boot it creates a 6 GB swap file (so low-RAM boxes don't get OOM-killed),
# installs Docker, downloads Hezo, sets up automatic HTTPS via Caddy, and starts Hezo
# under systemd. After ~2 minutes, open the URL it derives (https://<public-ip>.sslip.io)
# and finish the short in-browser setup: create your master key, set an admin
# password, and connect a model.
#
# OPTIONAL - change the swap size (default 6G, auto-shrunk to fit the disk): set
# HEZO_SWAP_SIZE below (e.g. 2G, or 0 to disable). Existing swap is left untouched.
#
# OPTIONAL — use your own domain instead of sslip.io: point an A record at the
# server, then uncomment and edit the HEZO_DOMAIN_OVERRIDE line under runcmd.
#
# OPTIONAL — managed data hosting: to keep the database in a managed Postgres
# and/or asset files in an S3-compatible bucket, uncomment and edit the
# /etc/hezo/hezo.config.cjs block below. Step-by-step guide:
# docs/deployment/one-click.md § Using managed data hosting.
# ---------------------------------------------------------------------------
package_update: true
packages:
  - curl

# To use a managed database and/or object storage for assets, uncomment this
# block and fill in the URLs. Remove either setting if you do not use it.
# write_files:
#   - path: /etc/hezo/hezo.config.cjs
#     owner: root:root
#     permissions: '0600'
#     content: |
#       const { existsSync, readFileSync } = require('node:fs');
#       const webUrlFile = '/etc/hezo/web-url';
#       module.exports = {
#         dataDir: '/var/lib/hezo',
#         webUrl: existsSync(webUrlFile) ? readFileSync(webUrlFile, 'utf8').trim() : '',
#         database: { url: 'postgres://hezo:PASSWORD@db-host:5432/hezo?sslmode=require' },
#         assetStorage: { url: 's3://ACCESS_KEY:SECRET@endpoint/bucket' },
#       };

runcmd:
  # To change the swap size (default 6G; set 0 to disable), set this before the curl line:
  # - [ sh, -c, "echo 'HEZO_SWAP_SIZE=2G' >> /etc/environment" ]
  # To use your own domain, set this before the curl line (A record must point here first):
  # - [ sh, -c, "echo 'HEZO_DOMAIN_OVERRIDE=hezo.example.com' >> /etc/environment" ]
  - [ sh, -c, "curl -fsSL https://raw.githubusercontent.com/hezo-ai/hezo/main/deploy/provision.sh -o /root/hezo-provision.sh" ]
  - [ sh, -c, "set -a; [ -f /etc/environment ] && . /etc/environment; set +a; bash /root/hezo-provision.sh" ]
