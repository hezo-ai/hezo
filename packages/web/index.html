<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- interactive-widget=resizes-content: let the on-screen keyboard shrink the
		     LAYOUT viewport (and thus 100dvh), not just the visual viewport. Without it
		     the default (resizes-visual) keeps the h-dvh shell full-height behind the
		     keyboard, so focusing the bottom-of-page comment composer scrolls it above
		     the keyboard and exposes empty scroller space as a gap. See __root.tsx. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
		/>
		<title>Hezo - Your own team of AI agents. Built to ship.</title>
		<meta
			name="description"
			content="Run a whole team of AI agents like a company — you set the goals, they ship the work, and you own everything they produce."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Hezo - Your own team of AI agents. Built to ship." />
		<meta
			property="og:description"
			content="Run a whole team of AI agents like a company — you set the goals, they ship the work, and you own everything they produce."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Hezo - Your own team of AI agents. Built to ship." />
		<meta
			name="twitter:description"
			content="Run a whole team of AI agents like a company — you set the goals, they ship the work, and you own everything they produce."
		/>
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#DB3B2C" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Hezo" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
		/>
		<script>
			(function () {
				var t = localStorage.getItem('theme');
				var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (t === 'dark' || (t !== 'light' && d)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		<script>
			// Capture the PWA install signal at the earliest possible moment. Chrome
			// fires `beforeinstallprompt` once, early in page load (and even earlier on
			// repeat visits, when the service worker is already active) — often before
			// the React bundle has mounted its own listener. The event isn't buffered by
			// the browser, so we catch it here (before /src/main.tsx loads) and stash it
			// for `useInstallPrompt` to read on mount.
			(function () {
				window.__hezoInstall = { event: null, installed: false };
				addEventListener('beforeinstallprompt', function (e) {
					// Suppress Chrome's default mini-infobar; we surface our own prompt.
					e.preventDefault();
					window.__hezoInstall.event = e;
					dispatchEvent(new Event('hezo:installable'));
				});
				addEventListener('appinstalled', function () {
					window.__hezoInstall.event = null;
					window.__hezoInstall.installed = true;
					dispatchEvent(new Event('hezo:installed'));
				});
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
